# Synthetic Confocal Particle Dataset — 128^3 v2
# Pipeline A: procedural bead generation + imaging simulation
#
# V2 changes from v1:
# - 2x dataset size
# - Smaller and more varied particle sizes (0.8–3.0, lognormal)
# - Wider density range (200–2000 particles)
# - All 4 deformation types enabled
# - Sharper particle rendering (gaussian_sharpness = 1.0)

source_type: synthetic

dataset:
  name: confocal_particles_128_v2
  output_dir: data/synthetic_confocal_128_v2
  volume_shape: [128, 128, 128]

generation:
  seed: 46
  parallel: false
  num_workers: 8
  save_metadata: true
  visualize_samples: true
  num_visualize: 5

splits:
  train: 1600
  val: 200
  test: 200

# --- Deformations (shared schema) ---
deformations:
  type_probabilities:
    affine: 0.4
    bspline: 0.3
    localized: 0.2
    combined: 0.1

  affine:
    translation_max: 3.0
    rotation_max: 5
    scale_min: 0.97
    scale_max: 1.03
    shear_max: 0.02

  bspline:
    control_grid_size: [8, 8, 8]
    displacement_max: 6.0
    displacement_min: 1.0
    smoothness: 0.8

  localized:
    num_centers_min: 1
    num_centers_max: 2
    center_displacement_max: 16.0
    radius_of_influence_min: 24
    radius_of_influence_max: 48
    decay_exponent: 2.0

  combined:
    affine_weight: 0.3
    bspline_weight: 0.7

quality:
  min_visible_beads_ratio: 0.65
  max_displacement_ratio: 0.5

# --- Synthetic-only sections ---
particles:
  particle_groups:
    # Per-group [min, max] ranges for count, radius, and intensity.
    - num_range: [100, 200]
      radius_range: [0.8, 1.5]
      intensity_range: [0.2, 0.6]
    - num_range: [400, 800]
      radius_range: [1.5, 3.0]
      intensity_range: [0.6, 1.0]
  min_distance_factor: 1.3
  margin_voxels: 3
  gaussian_sharpness: 1.0

  # Defines deformation of bead: [sz, sy, sx]
  anisotropy: [1.0, 1.0, 1.0]
  # Defines the z-axis depth attenuation.
  depth_attenuation:
    enabled: true
    mode: linear
    decay_rate: 0.01

imaging:
  psf_type: gaussian
  psf_sigma_min: 0
  psf_sigma_max: 0
  noise_type: poisson_gaussian
  snr_db_min: 30
  snr_db_max: 40
  background_mean: 0.02
  background_std: 0.01
  photobleaching_enabled: true
  photobleaching_factor_min: 0.95
  photobleaching_factor_max: 1.0
