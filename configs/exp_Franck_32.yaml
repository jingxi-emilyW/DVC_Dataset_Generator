# Experimental Dataset — Franck confocal beads, 32^3 volumes
# Pipeline B: crop sub-volumes from real TIF images + synthetic deformation

source_type: crop_from_image

dataset:
  name: exp_Franck_32
  output_dir: data/exp_Franck_32
  volume_shape: [32, 32, 32]

generation:
  seed: 56231
  parallel: false
  num_workers: 4
  save_metadata: true
  visualize_samples: true
  num_visualize: 5

splits:
  train: 0
  val: 0
  test: 50

warp_mode: backward_swap

# --- Deformations (shared schema) ---
deformations:
  type_probabilities:
    affine: 0.6
    bspline: 0.4
    localized: 0.0
    combined: 0.0

  affine:
    translation_max: 3.0
    rotation_max: 5
    scale_min: 0.97
    scale_max: 1.03
    shear_max: 0.02

  bspline:
    control_grid_size: [16, 16, 16]
    displacement_max: 5.0
    displacement_min: 1.0
    smoothness: 0.8

  localized:
    num_centers_min: 1
    num_centers_max: 2
    center_displacement_max: 16.0
    radius_of_influence_min: 24
    radius_of_influence_max: 48
    decay_exponent: 2.0

  combined:
    affine_weight: 0.3
    bspline_weight: 0.7

quality:
  min_visible_beads_ratio: 0.0
  max_displacement_ratio: 0.5

# --- crop_from_image only ---
input:
  format: tif
  raw_data_dir: data_tif/exp_Franck
  file_pattern: "*.tif"
  file_pattern_alternative: "*.tiff"
  min_volume_size: [32, 32, 32]

extraction:
  volume_size: [32, 32, 32]
  strategy: random
  total_volumes: 50
  margin: 5
  min_mean_intensity: 0.0
  min_std_intensity: 0.0

preprocessing:
  normalize: true
  clip_percentile: [1, 99]
  denoise: false
  denoise_sigma: 0.5
